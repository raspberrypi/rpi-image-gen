# METABEGIN
# X-Env-Layer-Name: rpi-boot-firmware
# X-Env-Layer-Category: firmware
# X-Env-Layer-Desc: Raspberry Pi boot firmware support infrastructure and
#  configuration for all devices
# X-Env-Layer-Version: 2.0.0
# X-Env-Layer-Requires: rpi-boot-bsp
# METAEND
---
mmdebstrap:
  customize-hooks:
    - mkdir -p $1/boot/firmware
    - ln -sf firmware/overlays $1/boot/overlays
