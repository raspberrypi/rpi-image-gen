# METABEGIN
# X-Env-Layer-Name: rpi-connect-ota
# X-Env-Layer-Category: service
# X-Env-Layer-Desc: Configures Raspberry Pi Connect's Remote Update capability
# X-Env-Layer-Version: 1.1.0
# X-Env-Layer-RequiresProvider: rpi-connect-client
#
# X-Env-VarRequires: IGconf_device_user1
# X-Env-VarRequires-Valid: string
#
# X-Env-VarPrefix: connectota
#
# X-Env-Var-bfmt: transitional
# X-Env-Var-bfmt-Desc: otamaker bundle format to produce. Must be readable by
#  the Applicator on the device that receives it, which may not be the same as
#  the version installed by this layer.
#  legacy: _contents_.yaml only (format 1)
#  manifest: _manifest_.yaml only (format 2)
#  transitional: Both, for applicators that read either format.
# X-Env-Var-bfmt-Required: n
# X-Env-Var-bfmt-Valid: legacy,manifest,transitional
# X-Env-Var-bfmt-Set: lazy
# METAEND
---
mmdebstrap:
  packages:
    - rpi-connect-ota
  customize-hooks:
  - |-
    set -eu

    # Enable remote update support in rpi-connectd
    cat <<-EOF > $1/etc/default/rpi-connect
    RPI_CONNECT_EXPERIMENTAL_OTA=t
    EOF

    # Configure D-Bus service for rpi-connect remote update
    cat <<-EOF > $1/usr/share/dbus-1/system.d/com.raspberrypi.Connect1.RemoteUpdateManager.conf
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE busconfig PUBLIC
    "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
    "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
    <busconfig>
      <policy user="${IGconf_device_user1}">
        <allow own="com.raspberrypi.Connect1.RemoteUpdateManager"/>

        <allow send_type="signal"
          send_interface="com.raspberrypi.Connect1.RemoteUpdateManager"
          send_member="NewDeployment"/>
      </policy>

      <policy user="root">
        <allow send_destination="com.raspberrypi.Connect1.RemoteUpdateManager"
          send_interface="com.raspberrypi.Connect1.RemoteUpdateManager"
          send_type="method_call"/>

        <allow send_destination="com.raspberrypi.Connect1.RemoteUpdateManager"
          send_interface="org.freedesktop.DBus.Introspectable"
          send_type="method_call"
          send_member="Introspect"/>
      </policy>
    </busconfig>
    EOF
