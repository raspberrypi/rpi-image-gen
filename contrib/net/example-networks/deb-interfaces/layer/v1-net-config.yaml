# METABEGIN
# X-Env-Layer-Name: v1-net-config
# X-Env-Layer-Desc: Example - static wired networking with ifupdown via
#  /etc/network/interfaces. Takes the interface away from systemd-networkd.
# X-Env-Layer-Version: 2.0.0
# X-Env-Layer-Category: connectivity
# X-Env-Layer-Provides: wired-static-config
# X-Env-Layer-RequiresProvider: systemd
# X-Env-Layer-AfterProvider: device,network-activator
# X-Env-Layer-Conflicts: v2-net-config,v3-net-config
#
# X-Env-VarPrefix: net
#
# X-Env-Var-iface: eth0
# X-Env-Var-iface-Desc: Wired interface the static configuration applies to.
# X-Env-Var-iface-Required: n
# X-Env-Var-iface-Valid: regex:^[a-zA-Z0-9_.-]+$
# X-Env-Var-iface-Set: y
#
# X-Env-Var-addr: 192.168.0.72/24
# X-Env-Var-addr-Desc: Static IPv4 address in CIDR notation.
# X-Env-Var-addr-Required: n
# X-Env-Var-addr-Valid: regex:^[0-9.]+/[0-9]+$
# X-Env-Var-addr-Set: y
#
# X-Env-Var-gw: 192.168.0.1
# X-Env-Var-gw-Desc: IPv4 default gateway.
# X-Env-Var-gw-Required: n
# X-Env-Var-gw-Valid: regex:^[0-9.]+$
# X-Env-Var-gw-Set: y
#
# X-Env-Var-dns: 192.168.0.1
# X-Env-Var-dns-Desc: Space separated DNS server addresses, in preference
#  order. Only list 127.0.0.1 if the image also runs a local resolver.
# X-Env-Var-dns-Required: n
# X-Env-Var-dns-Valid: string
# X-Env-Var-dns-Set: y
#
# X-Env-Var-addr6:
# X-Env-Var-addr6-Desc: Optional static IPv6 address in CIDR notation.
#  Leave empty for an IPv4-only interface.
# X-Env-Var-addr6-Required: n
# X-Env-Var-addr6-Valid: string-or-empty
# X-Env-Var-addr6-Set: y
#
# X-Env-Var-gw6:
# X-Env-Var-gw6-Desc: Optional IPv6 default gateway. Ignored unless addr6 is set.
# X-Env-Var-gw6-Required: n
# X-Env-Var-gw6-Valid: string-or-empty
# X-Env-Var-gw6-Set: y
# METAEND
---
mmdebstrap:
  packages:
    - ifupdown
  customize-hooks:
    - |-
      set -eu
      iface="${IGconf_net_iface}"
      install -d -m 0755 "$1/etc/network" "$1/etc/systemd/network"

      # ifupdown's postinst seeds /etc/network/interfaces; replace it with ours.
      {
        printf '# Generated by the v1-net-config example layer. See interfaces(5).\n'
        printf 'source /etc/network/interfaces.d/*\n\n'
        printf 'auto lo\niface lo inet loopback\n\n'
        printf 'auto %s\n' "$iface"
        printf 'iface %s inet static\n' "$iface"
        printf '    address %s\n' "${IGconf_net_addr}"
        printf '    gateway %s\n' "${IGconf_net_gw}"
        printf '    dns-nameservers %s\n' "${IGconf_net_dns}"
        if [ -n "${IGconf_net_addr6:-}" ]; then
          printf '\niface %s inet6 static\n' "$iface"
          printf '    address %s\n' "${IGconf_net_addr6}"
          if [ -n "${IGconf_net_gw6:-}" ]; then
            printf '    gateway %s\n' "${IGconf_net_gw6}"
          fi
        fi
      } > "$1/etc/network/interfaces"

      # rpi-device-base installs 01-<iface>.network with DHCP=yes for eth0.
      # Replace it (same filename) so systemd-networkd leaves the interface to
      # ifupdown instead of configuring it a second time.
      {
        printf '# Generated by the v1-net-config example layer.\n'
        printf '[Match]\nName=%s\n\n[Link]\nUnmanaged=yes\n' "$iface"
      } > "$1/etc/systemd/network/01-${iface}.network"

      $BDEBSTRAP_HOOKS/enable-units "$1" networking
