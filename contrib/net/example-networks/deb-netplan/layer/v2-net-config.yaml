# METABEGIN
# X-Env-Layer-Name: v2-net-config
# X-Env-Layer-Desc: Example - static wired networking with Netplan rendered
#  by systemd-networkd via /etc/netplan/00-installer.yaml.
# X-Env-Layer-Version: 2.0.0
# X-Env-Layer-Category: connectivity
# X-Env-Layer-Provides: wired-static-config
# X-Env-Layer-RequiresProvider: systemd-networkd
# X-Env-Layer-AfterProvider: device,network-activator
# X-Env-Layer-Conflicts: v1-net-config,v3-net-config
#
# X-Env-VarPrefix: net
#
# X-Env-Var-iface: eth0
# X-Env-Var-iface-Desc: Wired interface the static configuration applies to.
# X-Env-Var-iface-Required: n
# X-Env-Var-iface-Valid: regex:^[a-zA-Z0-9_.-]+$
# X-Env-Var-iface-Set: y
#
# X-Env-Var-addr: 192.168.0.72/24
# X-Env-Var-addr-Desc: Static IPv4 address in CIDR notation.
# X-Env-Var-addr-Required: n
# X-Env-Var-addr-Valid: regex:^[0-9.]+/[0-9]+$
# X-Env-Var-addr-Set: y
#
# X-Env-Var-gw: 192.168.0.1
# X-Env-Var-gw-Desc: IPv4 default gateway.
# X-Env-Var-gw-Required: n
# X-Env-Var-gw-Valid: regex:^[0-9.]+$
# X-Env-Var-gw-Set: y
#
# X-Env-Var-dns: 192.168.0.1
# X-Env-Var-dns-Desc: Space separated DNS server addresses, in preference
#  order. Only list 127.0.0.1 if the image also runs a local resolver.
# X-Env-Var-dns-Required: n
# X-Env-Var-dns-Valid: string
# X-Env-Var-dns-Set: y
#
# X-Env-Var-addr6:
# X-Env-Var-addr6-Desc: Optional static IPv6 address in CIDR notation.
#  Leave empty for an IPv4-only interface.
# X-Env-Var-addr6-Required: n
# X-Env-Var-addr6-Valid: string-or-empty
# X-Env-Var-addr6-Set: y
#
# X-Env-Var-gw6:
# X-Env-Var-gw6-Desc: Optional IPv6 default gateway. Ignored unless addr6 is set.
# X-Env-Var-gw6-Required: n
# X-Env-Var-gw6-Valid: string-or-empty
# X-Env-Var-gw6-Set: y
# METAEND
---
mmdebstrap:
  packages:
    - netplan.io
  customize-hooks:
    - |-
      set -eu
      iface="${IGconf_net_iface}"
      f="$1/etc/netplan/00-installer.yaml"
      install -d -m 0755 "$1/etc/netplan"

      {
        printf '# Generated by the v2-net-config example layer. See netplan(5).\n'
        printf 'network:\n  version: 2\n  renderer: networkd\n  ethernets:\n'
        printf '    %s:\n' "$iface"
        printf '      dhcp4: false\n      dhcp6: false\n'
        printf '      addresses:\n'
        printf '        - %s\n' "${IGconf_net_addr}"
        if [ -n "${IGconf_net_addr6:-}" ]; then
          printf '        - %s\n' "${IGconf_net_addr6}"
        fi
        printf '      routes:\n'
        printf '        - to: default\n          via: %s\n' "${IGconf_net_gw}"
        if [ -n "${IGconf_net_addr6:-}" ] && [ -n "${IGconf_net_gw6:-}" ]; then
          printf '        - to: default\n          via: %s\n' "${IGconf_net_gw6}"
        fi
        printf '      nameservers:\n        addresses:\n'
        for d in ${IGconf_net_dns}; do
          printf '          - %s\n' "$d"
        done
      } > "$f"
      # Netplan refuses world-readable configuration since 0.106.
      chmod 0600 "$f"

      # At boot Netplan renders /run/systemd/network/10-netplan-<iface>.network.
      # rpi-device-base installs /etc/systemd/network/01-<iface>.network with
      # DHCP=yes for eth0, which sorts first and would win, so remove it.
      rm -f "$1/etc/systemd/network/01-${iface}.network"
